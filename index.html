  canvas.height = H;
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}

function loadSave() {
  try {
    const d = JSON.parse(localStorage.getItem('ceubeDash') || '{}');
    return {
      unlockedLevels: 5,
      coins: d.coins || 0,
      ownedSkins: d.ownedSkins || ['default'],
      equippedSkin: d.equippedSkin || 'default',
    };
  } catch { return { unlockedLevels: 5, coins: 0, ownedSkins: ['default'], equippedSkin: 'default' }; }
}
function writeSave(data) {
  try { localStorage.setItem('ceubeDash', JSON.stringify(data)); } catch {}
}

saveData.coins = 0;                  // emeralds reset each session (not persistent)

// =============================================
//  LEVEL JSON FORMAT (forward-compatible with Phase 4 builder)
// =============================================
// This is the canonical structure for a saved level JSON.
// The builder will write this format; the game engine reads it.
// Fields marked [builder] are populated by the Level Builder in Phase 4.
// Fields marked [engine] are used now.
//
// {
//   "id": 1,                          // [engine] level number
//   "name": "JUNGLE",                 // [engine] display name
//   "emoji": "🌿",                    // [engine] menu icon
//   "length": 4500,                   // [engine] total level width in px
//   "entities": [                     // [engine] all placed objects
//     {
//       "type": "spike",              // spike | platform | portal | gravflip | ghostball | coin
//       "x": 480,                     // world x position
//       "y": 322,                     // world y position
//       "w": 32,                      // width (optional override)
//       "h": 32,                      // height (optional override)
//       "color": "#f44336",           // [builder] entity color override
//       "imageRef": null,             // [builder] uploaded image key (stored in level pkg)
//       // platform-specific:
//       "moveAxis": "x",             // [builder] "x" or "y"
//       "moveRange": 120,            // [builder] px travel distance
//       "moveSpeed": 1.5,            // [builder] px/frame
//       // portal-specific:
//       "portalId": "a",             // [builder] links entrance to exit
//       "portalRole": "entrance"     // [builder] "entrance" | "exit"
//     }
//   ],
//   "visual": {                       // [builder] all visual settings
//     "skyColors": ["#081508","#152515","#233823"],
//     "skyImageRef": null,            // [builder] uploaded background image key
//     "groundColor": "#388e3c",
//     "groundImageRef": null,         // [builder] uploaded ground image key
//     "stoneColor": "#828282",
//     "parallaxLayers": {             // [builder] toggle/color parallax elements
//       "trees": true,
//       "treeColor": "#1e4f1e"
//     },
//     "accentColor": "#66bb6a"
//   },
//   "images": {}                      // [builder] base64 image data keyed by imageRef strings
// }
//
// loadLevelFromJSON(jsonObj) — parses the above and populates game state.
// For Phase 2, levels are built from hardcoded data below.
// In Phase 4, the builder writes this JSON and the engine loads it directly.

function loadLevelFromJSON(json) {
  // Called by the engine whenever a level JSON is available (Phase 4+).
  // Fully wired to handle all entity types introduced through Phase 3.
  if (!json) return false;
  currentLevel = json.id;
  levelDef = LEVEL_DEFS.find(l => l.id === json.id) || LEVEL_DEFS[0];
  if (json.visual) {
    if (json.visual.skyColors)   levelDef = {...levelDef, skyColors:  json.visual.skyColors};
    if (json.visual.accentColor) levelDef = {...levelDef, accentColor: json.visual.accentColor};
  }
  // Apply per-level physics overrides
  if (json.physics) {
    moveSpeed = json.physics.moveSpeed !== undefined ? json.physics.moveSpeed : MOVE_SPEED;
    jumpVel   = json.physics.jumpVel   !== undefined ? json.physics.jumpVel   : JUMP_VEL;
    gravity   = json.physics.gravity   !== undefined ? json.physics.gravity   : GRAVITY;
    maxJumps  = json.physics.maxJumps  !== undefined ? json.physics.maxJumps  : MAX_JUMPS;
  } else {
    moveSpeed = MOVE_SPEED; jumpVel = JUMP_VEL; gravity = GRAVITY; maxJumps = MAX_JUMPS;
  }
  levelLen = json.length || LEVEL_LEN;
  finishX  = levelLen - 320;
  const ents = json.entities || [];
  spikes     = ents.filter(e=>e.type==='spike').map(e=>({wx:e.x, wy:e.y}));
  coins      = ents.filter(e=>e.type==='coin').map(e=>({wx:e.x, wy:e.y, collected:false}));
  platforms  = ents.filter(e=>e.type==='platform').map(e=>({
    wx:e.x, wy:e.y, w:e.w||96, h:e.h||16,
    axis:e.moveAxis||'x', range:e.moveRange||120, speed:e.moveSpeed||1.5,
    t:0, riderDX:0,
  }));
  // Build portal pairs: group by portalId
  const portalEnts = ents.filter(e=>e.type==='portal');
  const portalMap = {};
  for (const pe of portalEnts) {
    if (!portalMap[pe.portalId]) portalMap[pe.portalId] = {};
    portalMap[pe.portalId][pe.portalRole] = {wx:pe.x, wy:pe.y, w:pe.w||36, h:pe.h||54, id:pe.portalId, role:pe.portalRole, cooldown:0};
  }
  portals = Object.values(portalMap);
  gravFlips  = ents.filter(e=>e.type==='gravflip').map(e=>({wx:e.x, wy:e.y, w:e.w||64, h:e.h||16, cooldown:0}));
  ghostBalls = ents.filter(e=>e.type==='ghostball').map(e=>({wx:e.x, wy:e.y, r:e.r||14, active:true}));
  ceilSpikes  = ents.filter(e=>e.type==='ceilspike').map(e=>({wx:e.x, wy:e.y}));
  solidBlocks = ents.filter(e=>e.type==='block').map(e=>({wx:e.x, wy:e.y}));
  totalCoins = coins.length;
  coinsCollected = 0;

  // Load images and sprites from JSON
  levelImgCache = {};
  levelSpriteCache = {};

  function loadB64Image(b64, key, cache) {
    if (!b64) return;
    const img = new Image();
    img.src = b64;
    cache[key] = img;
  }

  if (json.images) {
    loadB64Image(json.images.sky,       'sky',       levelImgCache);
    loadB64Image(json.images.ground,    'ground',    levelImgCache);
    loadB64Image(json.images.parallax1, 'parallax1', levelImgCache);
    loadB64Image(json.images.parallax2, 'parallax2', levelImgCache);
  }
  if (json.sprites) {
    for (const [type, b64] of Object.entries(json.sprites)) {
      loadB64Image(b64, type, levelSpriteCache);
    }
  }

  return true;
}

// =============================================
//  CEILING SPIKE LAYOUTS (inverted, for gravity-flip zones)
// =============================================
function buildCeilSpikes(levelId) {
  if (levelId < 4) return [];
  const out = [];
  // Level 4: ceiling spikes filling the space between flip-up and flip-back triggers
  // Zone 1: x=930 to x=1340 (between first flip-up at 900 and flip-back at 1350)
  // Zone 2: x=2230 to x=2790
  // Zone 3: x=3430 to x=3990
  const zones = {
    4: [ [930, 1340], [2230, 2790], [3430, 3990] ],
    5: [ [1030, 1590], [2830, 3390] ],
  };
  for (const [start, end] of (zones[levelId] || [])) {
    for (let wx = start; wx < end; wx += S_SIZE) {
      out.push({ wx, wy: 0 });  // wy:0 = attached to ceiling, tip points down
    }
  }
  return out;
}

        tiles.push({ wx: g.wx + c * BLK_SIZE, wy: g.wy + r * BLK_SIZE });
  }
  return tiles;
}

function srng(seed) {
  seed = ((seed * 1664525 + 1013904223) & 0xffffffff) >>> 0;
  return seed / 4294967296;
}

// =============================================
//  PARTICLES
// =============================================
class Particle {
  constructor(x, y, vx, vy, color, life, size, grav = 0.18) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.color=color; this.life=life; this.maxLife=life;
    this.size=size; this.grav=grav;
  }
  update() {
    this.x  += this.vx; this.y  += this.vy;
    this.vy += this.grav; this.vx *= 0.97;
    return --this.life > 0;
  }
  draw(camX) {
    const a = this.life / this.maxLife;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    const s = this.size * a;
    ctx.fillRect(this.x - camX - s/2, this.y - s/2, s, s);
    ctx.restore();
  }
}

// Fade transition
let fadeAlpha  = 0;
let fadeDir    = 0;      // -1=darken, 1=lighten, 0=stable
let fadeTarget = '';

function startFade(target) {
  fadeDir    = -1;
  fadeTarget = target;
}

function updateFade() {
  if (fadeDir === -1) {
    fadeAlpha = Math.min(1, fadeAlpha + 0.07);
    if (fadeAlpha >= 1) {
      // Execute screen switch
      if      (fadeTarget === 'title')       screen = 'title';
      else if (fadeTarget === 'levelselect') screen = 'levelselect';
      else if (fadeTarget === 'store')       screen = 'store';
      else if (fadeTarget.startsWith('level:')) {
        const id = parseInt(fadeTarget.split(':')[1]);
        loadLevel(id);
        screen = 'ready';
      }
      fadeDir = 1;
    }
  } else if (fadeDir === 1) {
    fadeAlpha = Math.max(0, fadeAlpha - 0.07);
    if (fadeAlpha <= 0) fadeDir = 0;
  }
}

// Title stars

}));

// Mouse / hover

// =============================================
//  LEVEL CARD LAYOUT
// =============================================
function getLevelCards() {
  const cardW=140, cardH=110, gap=20;
  const row1y=145, row2y=290;
  const row1x=W/2-(3*cardW+2*gap)/2;
  const row2x=W/2-(2*cardW+gap)/2;
  return [
    {id:1, x:row1x,              y:row1y, w:cardW, h:cardH},
    {id:2, x:row1x+cardW+gap,    y:row1y, w:cardW, h:cardH},
    {id:3, x:row1x+2*(cardW+gap),y:row1y, w:cardW, h:cardH},
    {id:4, x:row2x,              y:row2y, w:cardW, h:cardH},
    {id:5, x:row2x+cardW+gap,    y:row2y, w:cardW, h:cardH},
  ];
}

function cardAtPoint(x, y) {
  for (const c of getLevelCards())
    if (x>=c.x && x<=c.x+c.w && y>=c.y && y<=c.y+c.h) return c.id;
  return null;
}

// =============================================
//  INPUT
// =============================================
function doJump() {
  if (screen !== 'playing') return;

  // Ghost ball interaction — jump off it whenever near one, regardless of jumps remaining
  for (const gb of ghostBalls) {
    const cx = gb.wx, cy = gb.wy;
    const px = player.wx + P_SIZE/2, py = player.wy + P_SIZE/2;
    const dist = Math.hypot(px - cx, py - cy);
    if (dist < gb.r + P_SIZE/2 + 2) {
      // bounce off ghost ball — larger window, always fires
      player.vy = jumpVel * 1.1;
      player.jumpsLeft = 0;
      player.onGround = false;
      jumpHeld = true;
      for (let i = 0; i < 12; i++) {
        const a = (i/12)*Math.PI*2;
        particles.push(new Particle(cx, cy,
          Math.cos(a)*6, Math.sin(a)*6,
          '#FFD700', 20, 5, 0.05));
      }
      return;
    }
  }

  if (player.jumpsLeft > 0) {
    player.vy = gravityFlipped ? Math.abs(jumpVel) : jumpVel;
    player.jumpsLeft--;
    player.onGround = false; jumpHeld = true;
    for (let i=0;i<10;i++) particles.push(new Particle(
      player.wx+P_SIZE/2, gravityFlipped ? player.wy : player.wy+P_SIZE,
      (Math.random()-.5)*5, (gravityFlipped ? -1 : 1)*(Math.random()*-3+.5),
      Math.random()>.5?'#00E5FF':'#80DEEA',
      14+Math.random()*10, 3+Math.random()*4, 0.08));
  }
}

canvas.addEventListener('mousemove', e => {
  const r=canvas.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
  mouseY=(e.clientY-r.top)*(H/r.height);
  if (screen==='levelselect') hoveredLevel = cardAtPoint(mouseX,mouseY)||0;
  else hoveredLevel=0;
  if (screen==='store') {
    storeHovered = null;
    for (let i=0; i<SKINS.length; i++) {
      const skin = SKINS[i];
      if (!skin.available) continue;
      const cx = storeCardX(i);
      if (mouseX>=cx && mouseX<=cx+CARD_W && mouseY>=CARDS_Y && mouseY<=CARDS_Y+CARD_H) {
        storeHovered = skin.id; break;
      }
    }
  } else { storeHovered = null; }
});

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const px=(e.clientX-r.left)*(W/r.width);
  const py=(e.clientY-r.top)*(H/r.height);
  handleClick(px, py);
});
canvas.addEventListener('pointerup',     () => { jumpHeld=false; });
canvas.addEventListener('pointercancel', () => { jumpHeld=false; });

window.addEventListener('keydown', e => {
  if (e.code==='Space'||e.code==='ArrowUp') {
    e.preventDefault();
    if (screen==='ready')  { screen='playing'; return; }
    if (screen==='dead' && deathDelay>45) { if(isTestPlay){reloadTestLevel();}else{loadLevel(currentLevel);screen='ready';} return; }
    if (paused) return;
    doJump();
  }
  if (e.code==='Escape'||e.code==='KeyP') {
    e.preventDefault();
    if (screen==='playing' || screen==='ready') {
      paused = !paused;
      return;
    }
    if (paused) { paused = false; return; }
    if (screen==='store') startFade('title');
  }
});
window.addEventListener('keyup', e => {
  if (e.code==='Space'||e.code==='ArrowUp') jumpHeld=false;
});

function handleClick(x, y) {
  // ----- PAUSE MENU -----
  if (paused) {
    // Resume button
    if (x >= W/2-110 && x <= W/2+110 && y >= H/2-20 && y <= H/2+26) {
      paused = false;
      return;
    }
    // Quit to menu button
    if (x >= W/2-110 && x <= W/2+110 && y >= H/2+40 && y <= H/2+86) {
      paused = false;
      startFade('levelselect');
      return;
    }
    return; // swallow all other clicks while paused
  }
  // ----- TITLE -----
  if (screen==='title') {
    // Store button (bottom left)
    if (x>=18&&x<=138&&y>=H-82&&y<=H-18) { startFade('store'); return; }
    // Play button
    const bx=W/2-120, by=H/2-10, bw=240, bh=64;
    if (x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh) startFade('levelselect');
    return;
  }
  // ----- STORE -----
  if (screen==='store') {
    // Back button (top left)
    if (x>=20&&x<=110&&y>=14&&y<=44) { startFade('title'); return; }
    // Skin card clicks
    for (let i = 0; i < SKINS.length; i++) {
      const skin = SKINS[i];
      if (!skin.available) continue;
      const cx = storeCardX(i);
      const cy = CARDS_Y;
      if (x < cx || x > cx+CARD_W || y < cy || y > cy+CARD_H) continue;
      const owned = saveData.ownedSkins.includes(skin.id);
      if (owned || skin.price === 0) {
        // Equip
        saveData.equippedSkin = skin.id;
        writeSave(saveData);
      } else if (saveData.coins >= skin.price) {
        // Buy
        saveData.coins -= skin.price;
        saveData.ownedSkins.push(skin.id);
        saveData.equippedSkin = skin.id;
        writeSave(saveData);
      }
      return;
    }
    return;
  }
  // ----- LEVEL SELECT -----
  if (screen==='levelselect') {
    // Back button
    if (x>=20&&x<=110&&y>=14&&y<=44) { startFade('title'); return; }
    const id = cardAtPoint(x,y);
    if (id === 5) startFade(`level:${id}`);
    return;
  }
  // ----- BUILDER BUTTON (test play mode) -----
  if (isTestPlay && x>=8 && x<=118 && y>=8 && y<=36) {
    try { window.close(); } catch(e) {}
    history.back();
    return;
  }
  // ----- READY -----
  if (screen==='ready') { screen='playing'; return; }
  // ----- PLAYING (tap to jump on touch devices) -----
  if (screen==='playing' && !paused) { doJump(); return; }
  // ----- DEAD -----
  if (screen==='dead' && deathDelay>45) {
    // Two buttons: retry (left) | menu (right)
    const by=H/2+80, bh=46;
    if (y>=by&&y<=by+bh) {
      if (x<W/2) { if(isTestPlay){reloadTestLevel();}else{loadLevel(currentLevel);screen='ready';} }
      else        { if(isTestPlay){reloadTestLevel();}else{startFade('levelselect');} }
    } else { if(isTestPlay){reloadTestLevel();}else{loadLevel(currentLevel);screen='ready';} }
    return;
  }
  // ----- WIN -----
  if (screen==='win') {
    const by=H/2+100, bh=46;
    if (y>=by&&y<=by+bh) {
      if (x<W/2) { if(isTestPlay){reloadTestLevel();}else{loadLevel(currentLevel);screen='ready';} }
      else        { if(isTestPlay){reloadTestLevel();}else{startFade('levelselect');} }
    }
    return;
  }
}

// =============================================
//  COLLISION — SPIKE TRIANGLE
// =============================================
function hitSpike(pl, sp) {
  const M=5;
  const pl_l=pl.wx+M, pl_r=pl.wx+P_SIZE-M;
  const pl_t=pl.wy+M, pl_b=pl.wy+P_SIZE-M;
  if (pl_r<=sp.wx||pl_l>=sp.wx+S_SIZE) return false;
  if (pl_b<=sp.wy||pl_t>=sp.wy+S_SIZE) return false;
  const cx=sp.wx+S_SIZE/2;
  for (const cy of [pl_t,(pl_t+pl_b)/2,pl_b]) {
    if (cy<sp.wy||cy>sp.wy+S_SIZE) continue;
    const t=(cy-sp.wy)/S_SIZE;
    const halfW=(S_SIZE/2-M)*t;
    if (pl_r>cx-halfW&&pl_l<cx+halfW) return true;
  }
  return false;
}

// Ceiling spike: base at wy=0, tip points DOWN to wy+S_SIZE
function hitCeilSpike(pl, sp) {
  const M=5;
  const pl_l=pl.wx+M, pl_r=pl.wx+P_SIZE-M;
  const pl_t=pl.wy+M, pl_b=pl.wy+P_SIZE-M;
  const spTop=sp.wy, spBot=sp.wy+S_SIZE;
  if (pl_r<=sp.wx||pl_l>=sp.wx+S_SIZE) return false;
  if (pl_b<=spTop||pl_t>=spBot) return false;
  const cx=sp.wx+S_SIZE/2;
  // Tip is at bottom (spBot), triangle widens toward top (spTop)
  for (const cy of [pl_t,(pl_t+pl_b)/2,pl_b]) {
    if (cy<spTop||cy>spBot) continue;
    const t=(spBot-cy)/S_SIZE;  // t=1 at tip (bottom), t=0 at base (top)
    const halfW=(S_SIZE/2-M)*t;
    if (pl_r>cx-halfW&&pl_l<cx+halfW) return true;
  }
  return false;
}

// =============================================
//  UPDATE
// =============================================
function update() {
  gFrame++;
  updateFade();

  if (screen==='title'||screen==='levelselect') return;

  if (screen==='dead') {
    deathDelay++; particles=particles.filter(p=>p.update()); return;
  }

  if (screen==='win') {
    winFrame++;
    if (winFrame%5===0) {
      const cols=['#FFD700','#FF69B4','#00E5FF','#98FB98','#FF7F50','#e0aaff'];
      for (let i=0;i<4;i++) winParticles.push(new Particle(
        Math.random()*W, -10,
        (Math.random()-.5)*4, Math.random()*3+2,
        cols[Math.floor(Math.random()*cols.length)],
        80+Math.random()*60, 6+Math.random()*8, 0.15));
    }
    winParticles=winParticles.filter(p=>p.update()); return;
  }

  if (screen==='ready') return;
  if (screen!=='playing') return;
  if (paused) return;

  frame++;

  // ── Update moving platforms ──
  for (const pl of platforms) {
    pl.t += pl.speed / pl.range;
    const osc = Math.sin(pl.t);
    pl._prevX = pl._x;
    pl._prevY = pl._y;
    pl._x = pl.wx + (pl.axis==='x' ? osc * pl.range : 0);
    pl._y = pl.wy + (pl.axis==='y' ? osc * (pl.range/2) : 0);
    pl.riderDX = pl._x - pl._prevX;
    pl.riderDY = pl._y - pl._prevY;
  }

  // ── Tick portal cooldowns ──
  for (const pair of portals) {
    if (pair.entrance.cooldown > 0) pair.entrance.cooldown--;
    if (pair.exit.cooldown     > 0) pair.exit.cooldown--;
  }
  for (const gf of gravFlips) {
    if (gf.cooldown > 0) gf.cooldown--;
  }

  // ── Physics ──
  const gravDir = gravityFlipped ? -1 : 1;
  const isJumpCut = !player.onGround && (gravityFlipped ? player.vy > 0 : player.vy < 0) && !jumpHeld;
  const grav = isJumpCut ? gravity * 2.8 : gravity;
  player.vy += grav * gravDir;
  player.wx += moveSpeed;
  player.wy += player.vy;

  // ── Platform riding ──
  player.onPlatform = null;
  for (const pl of platforms) {
    const px = pl._x, py = pl._y;
    const pRight = px + pl.w, pTop = py;

    if (!gravityFlipped) {
      // Normal gravity: land on top of platform
      const prevBottom = player.wy + P_SIZE - player.vy;
      const onX = player.wx + P_SIZE > px + 4 && player.wx < pRight - 4;
      const crossTop = prevBottom <= pTop + 2 && player.wy + P_SIZE >= pTop;
      if (onX && crossTop && player.vy >= 0) {
        player.wy = pTop - P_SIZE;
        player.vy = 0;
        player.onGround = true;
        player.jumpsLeft = maxJumps;
        player.onPlatform = pl;
        player.wx += pl.riderDX;
        player.wy += pl.riderDY;
        jumpHeld = false;
        const snap = Math.round(player.rot/90)*90;
        player.rot += (snap - player.rot)*0.3;
      }
    } else {
      // Flipped gravity: land on bottom of platform
      const pBottom = py + pl.h;
      const prevTop = player.wy - player.vy;
      const onX = player.wx + P_SIZE > px + 4 && player.wx < pRight - 4;
      const crossBottom = prevTop >= pBottom - 2 && player.wy <= pBottom;
      if (onX && crossBottom && player.vy <= 0) {
        player.wy = pBottom;
        player.vy = 0;
        player.onGround = true;
        player.jumpsLeft = maxJumps;
        player.onPlatform = pl;
        player.wx += pl.riderDX;
        player.wy += pl.riderDY;
        jumpHeld = false;
        const snap = Math.round(player.rot/90)*90;
        player.rot += (snap - player.rot)*0.3;
      }
    }
  }

  // ── Ground / ceiling ──
  if (!gravityFlipped) {
    const groundTop = GROUND_Y - P_SIZE;
    if (player.wy >= groundTop) {
      player.wy = groundTop; player.vy = 0;
      player.jumpsLeft = maxJumps; player.onGround = true; jumpHeld = false;
      const snap = Math.round(player.rot/90)*90;
      player.rot += (snap - player.rot)*0.3;
    } else if (player.onPlatform === null) {
      player.onGround = false;
    }
  } else {
    // Flipped: ceiling is at y=0, player's top hits it
    if (player.wy <= 0) {
      player.wy = 0; player.vy = 0;
      player.jumpsLeft = maxJumps; player.onGround = true; jumpHeld = false;
      const snap = Math.round(player.rot/90)*90;
      player.rot += (snap - player.rot)*0.3;
    } else if (player.onPlatform === null) {
      player.onGround = false;
    }
    // Also stop at ground (in case flipped and falling back down)
    if (player.wy >= GROUND_Y - P_SIZE) {
      player.wy = GROUND_Y - P_SIZE; player.vy = 0;
      gravityFlipped = false;
      player.jumpsLeft = maxJumps; player.onGround = true; jumpHeld = false;
    }
  }

  if (!player.onGround) player.rot = (player.rot + 5) % 360;

  // ── Portal teleport (entrance only — exit is one-way) ──
  for (const pair of portals) {
    // Only entrance triggers a teleport; exit portal is just the destination
    const from = pair.entrance, to = pair.exit;
    if (from.cooldown > 0) continue;
    const px = player.wx + P_SIZE/2, py = player.wy + P_SIZE/2;
    if (px > from.wx && px < from.wx + from.w && py > from.wy && py < from.wy + from.h) {
      player.wx = to.wx + to.w/2 - P_SIZE/2;
      player.wy = to.wy + to.h - P_SIZE;
      from.cooldown = 60;
      to.cooldown   = 60;
      for (let i = 0; i < 16; i++) {
        const a = (i/16)*Math.PI*2;
        particles.push(new Particle(
          to.wx + to.w/2, to.wy + to.h/2,
          Math.cos(a)*5, Math.sin(a)*5,
          i%2===0?'#ce93d8':'#ff80ab', 22, 5, 0.04));
      }
    }
  }

  // ── Gravity flip trigger ──
  for (const gf of gravFlips) {
    if (gf.cooldown > 0) continue;
    const isFloorTrigger = gf.wy > H / 2;   // below midscreen = floor trigger
    // Floor trigger only fires when gravity is normal; ceiling trigger only when flipped
    if (isFloorTrigger === gravityFlipped) continue;
    // Use player bounding box for detection, not just center — wider hit zone
    const pl_l = player.wx + 4, pl_r = player.wx + P_SIZE - 4;
    const pl_t = player.wy,     pl_b = player.wy + P_SIZE;
    const gf_l = gf.wx,         gf_r = gf.wx + gf.w;
    const gf_t = gf.wy - 8,     gf_b = gf.wy + gf.h + 8;  // slightly expanded hit zone
    const overlapX = pl_r > gf_l && pl_l < gf_r;
    const overlapY = pl_b > gf_t && pl_t < gf_b;
    if (overlapX && overlapY) {
      gravityFlipped = !gravityFlipped;
      // Strong launch in the new gravity direction so player actually reaches ceiling/floor
      player.vy = gravityFlipped ? jumpVel * 1.1 : Math.abs(jumpVel) * 1.1;
      player.onGround = false;
      player.jumpsLeft = maxJumps;
      gf.cooldown = 120;
      // Flip particles
      for (let i = 0; i < 20; i++) {
        const a = (i/20)*Math.PI*2;
        particles.push(new Particle(
          player.wx+P_SIZE/2, player.wy+P_SIZE/2,
          Math.cos(a)*5, Math.sin(a)*5,
          i%2===0?'#00e5ff':'#69f0ae', 30, 6, 0.02));
      }
    }
  }

  // ── Trail ──
  if (++player.trailT%2===0) {
    const tc=['#00E5FF','#00ACC1','#80DEEA'];
    particles.push(new Particle(
      player.wx+P_SIZE/2, player.wy+P_SIZE/2,
      -moveSpeed*.4+(Math.random()-.5)*.8,(Math.random()-.5)*1.5,
      tc[frame%3],10+Math.random()*8,3+Math.random()*3,0));
  }

  // ── Camera ──
  const targetCam = player.wx - W*0.22;
  camX += (targetCam - camX)*0.12; camX = Math.max(0, camX);

  // ── Coin collection ──
  for (const c of coins) {
    if (c.collected) continue;
    const cx=c.wx+C_SIZE/2, cy=c.wy+C_SIZE/2;
    const px=player.wx+P_SIZE/2, py=player.wy+P_SIZE/2;
    if (Math.abs(cx-px)<P_SIZE/2+C_SIZE/2-2 && Math.abs(cy-py)<P_SIZE/2+C_SIZE/2-2) {
      c.collected=true; coinsCollected++;
      for (let i=0;i<6;i++) {
        const a=(i/6)*Math.PI*2;
        particles.push(new Particle(cx,cy,Math.cos(a)*4,Math.sin(a)*4,'#00e676',18,4,0.1));
      }
    }
  }

  // ── Solid block collision ──
  for (const blk of solidBlocks) {
    const bLeft = blk.wx, bRight = blk.wx + BLK_SIZE;
    const bTop  = blk.wy, bBot   = blk.wy + BLK_SIZE;
    const pLeft = player.wx,           pRight = player.wx + P_SIZE;
    const pTop  = player.wy,           pBot   = player.wy + P_SIZE;

    // AABB overlap check
    if (pRight <= bLeft || pLeft >= bRight || pBot <= bTop || pTop >= bBot) continue;

    // Determine penetration depths
    const overlapL = pRight - bLeft;
    const overlapR = bRight - pLeft;
    const overlapT = pBot  - bTop;
    const overlapB = bBot  - pTop;
    const minH = Math.min(overlapL, overlapR);
    const minV = Math.min(overlapT, overlapB);

    // Corner bias: only kill on side if horizontal penetration is clearly dominant.
    // Without this, moving across adjacent block tops triggers a false side-kill.
    const SIDE_BIAS = 3;
    if (!gravityFlipped) {
      if (minV < minH + SIDE_BIAS) {
        // Vertical collision
        if (overlapT < overlapB) {
          // Landing on top
          player.wy = bTop - P_SIZE;
          player.vy = 0;
          player.onGround = true;
          player.jumpsLeft = maxJumps;
          jumpHeld = false;
          const snap = Math.round(player.rot/90)*90;
          player.rot += (snap - player.rot)*0.3;
        } else {
          // Hitting underside — push down
          player.wy = bBot;
          player.vy = Math.abs(player.vy) * 0.3;
        }
      } else {
        // Side collision — kill player
        killPlayer(); return;
      }
    } else {
      if (minV < minH + SIDE_BIAS) {
        if (overlapB < overlapT) {
          // Flipped: landing on underside of block
          player.wy = bBot;
          player.vy = 0;
          player.onGround = true;
          player.jumpsLeft = maxJumps;
          jumpHeld = false;
        } else {
          player.wy = bTop - P_SIZE;
          player.vy = -Math.abs(player.vy) * 0.3;
        }
      } else {
        killPlayer(); return;
      }
    }
  }

  // ── Spike collision ──
  for (const sp of spikes) {
    if (hitSpike(player, sp)) { killPlayer(); return; }
  }
  // ── Ceiling spike collision (inverted — tip points down from y=0) ──
  for (const sp of ceilSpikes) {
    if (hitCeilSpike(player, sp)) { killPlayer(); return; }
  }

  // ── Distance-based completion ──
  const distPct = Math.min(100, Math.round((player.wx - 100) / (finishX - 100) * 100));

  // ── Win ──
  if (player.wx >= finishX) { onWin(distPct); return; }

  particles = particles.filter(p => p.update());
}

function onWin(distPct=100) {
  screen='win'; winFrame=0; winParticles=[]; newLevelUnlocked=false;
  lastDistPct = distPct;
  saveData.coins+=coinsCollected;
  if (currentLevel<5 && saveData.unlockedLevels<=currentLevel) {
    saveData.unlockedLevels=currentLevel+1; newLevelUnlocked=true;
  }
  writeSave(saveData);
}

function killPlayer() {
  if (!player.alive) return;
  player.alive=false; screen='dead'; deathDelay=0;
  const cols=['#00E5FF','#00ACC1','#E0F7FA','#FF5252','#FFCA28','#FF9800','#fff'];
  for (let i=0;i<55;i++) {
    const a=Math.random()*Math.PI*2, s=2+Math.random()*10;
    particles.push(new Particle(
      player.wx+P_SIZE/2, player.wy+P_SIZE/2,
      Math.cos(a)*s, Math.sin(a)*s-2,
      cols[i%cols.length], 35+Math.random()*35, 5+Math.random()*8, 0.3));
  }
}

// =============================================
//  DRAW — BACKGROUNDS
// =============================================
function drawBgJungle(cx) {
  const layers=[
    {p:0.25,sp:120,hB:65,hV:60,wB:40,wV:30,col:['#112b11','#1a3d1a'],tw:5},
    {p:0.42,sp:95, hB:75,hV:65,wB:45,wV:30,col:['#1e4f1e','#275c27'],tw:6},
    {p:0.62,sp:75, hB:55,hV:55,wB:35,wV:25,col:['#2a622a','#3a7a3a'],tw:5},
  ];
  for (let li=0;li<layers.length;li++) {
    const {p,sp,hB,hV,wB,wV,col,tw}=layers[li];
    const px=cx*p, s=sp;
    for (let i=Math.floor((px-W)/s)-1;i<=Math.ceil((px+W*2)/s)+1;i++) {
      const seed=i*31+li*1000, r1=srng(seed), r2=srng(seed+7);
      const tx=i*s+r1*s*0.45-px, h=hB+r2*hV, w=wB+r1*wV;
      if (tx<-w-5||tx>W+w+5) continue;
      ctx.fillStyle='#3d2007';
      ctx.fillRect(tx+w/2-tw/2,GROUND_Y-h*0.38,tw,h*0.38);
      ctx.fillStyle=col[0];
      ctx.beginPath(); ctx.arc(tx+w/2,GROUND_Y-h*0.52,w/2*1.15,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=col[1];
      ctx.beginPath(); ctx.arc(tx+w/2-w*0.18,GROUND_Y-h*0.58,w/2*0.72,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawBgCyber(cx) {
  const px=cx*0.30;
  for (let i=0;i<18;i++) {
    const seed=i*37;
    const bx=((i*88+srng(seed)*40)-px+W*2)%(W+160)-80;
    const bh=60+srng(seed+1)*140, bw=28+srng(seed+2)*45;
    ctx.fillStyle='rgba(5,10,30,0.95)';
    ctx.fillRect(bx,GROUND_Y-bh,bw,bh);
    for (let wy=0;wy<bh-10;wy+=12) {
      for (let wx=4;wx<bw-4;wx+=10) {
        if (srng(seed+wy*7+wx)>0.5) {
          ctx.fillStyle=srng(seed+wy+wx)>0.5?'#00e5ff':'#e040fb';
          ctx.globalAlpha=0.6+srng(seed+wy+wx+3)*0.4;
          ctx.fillRect(bx+wx,GROUND_Y-bh+wy+4,5,5);
          ctx.globalAlpha=1;
        }
      }
    }
  }
}

function drawBgDemon(cx) {
  const glow=ctx.createLinearGradient(0,GROUND_Y-60,0,GROUND_Y);
  glow.addColorStop(0,'rgba(150,0,0,0)'); glow.addColorStop(1,'rgba(255,60,0,0.25)');
  ctx.fillStyle=glow; ctx.fillRect(0,GROUND_Y-60,W,60);
  const px=cx*0.25;
  for (let i=0;i<12;i++) {
    const seed=i*53+500;
    const sx=((i*120+srng(seed)*60)-px+W*2)%(W+180)-90;
    const sh=80+srng(seed+1)*160, sw=20+srng(seed+2)*30;
    ctx.fillStyle='rgba(20,0,10,0.95)';
    ctx.beginPath(); ctx.moveTo(sx,GROUND_Y); ctx.lineTo(sx+sw/2,GROUND_Y-sh); ctx.lineTo(sx+sw,GROUND_Y); ctx.closePath(); ctx.fill();
  }
}

function drawBgJurassic(cx) {
  // Layer 1 (far): dark silhouette tree canopy
  const px1 = cx * 0.18;
  for (let i = 0; i < 10; i++) {
    const seed = i * 53 + 800;
    const tx = ((i * 160 + srng(seed) * 80) - px1 + W * 2) % (W + 200) - 100;
    const th = 110 + srng(seed+1) * 90, tw = 55 + srng(seed+2) * 40;
    ctx.fillStyle = `hsl(${100+srng(seed+3)*20},${25+srng(seed+4)*10}%,${10+srng(seed+5)*6}%)`;
    // Trunk
    ctx.fillRect(tx + tw/2 - 5, GROUND_Y - th * 0.55, 10, th * 0.55);
    // Canopy blobs
    for (let b = 0; b < 3; b++) {
      const bx = tx + tw/2 + (srng(seed+b*7)-0.5)*tw*0.6;
      const by = GROUND_Y - th * (0.55 + srng(seed+b*3)*0.45);
      const br = tw * (0.28 + srng(seed+b*11)*0.22);
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.fill();
    }
  }

  // Layer 2 (mid): large prehistoric ferns/palm trees
  const px2 = cx * 0.32;
  for (let i = 0; i < 14; i++) {
    const seed = i * 41 + 900;
    const fx = ((i * 115 + srng(seed) * 55) - px2 + W * 2) % (W + 180) - 90;
    const fh = 55 + srng(seed+1) * 80;
    const ftype = Math.floor(srng(seed+9) * 3); // 0=fern, 1=palm, 2=giant fern

    ctx.save();
    if (ftype === 1) {
      // Palm-style: curved trunk + fronds
      const col = `hsl(${88+srng(seed+2)*25},${35+srng(seed+3)*20}%,${18+srng(seed+4)*12}%)`;
      ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
      // Trunk
      ctx.beginPath();
      ctx.moveTo(fx, GROUND_Y);
      ctx.quadraticCurveTo(fx + srng(seed+5)*30-15, GROUND_Y - fh*0.5, fx + srng(seed+6)*20-10, GROUND_Y - fh);
      ctx.stroke();
      // Fronds radiating from top
      const topX = fx + srng(seed+6)*20-10, topY = GROUND_Y - fh;
      ctx.lineWidth = 2;
      for (let j = 0; j < 7; j++) {
        const ang = (-0.8 + j * 0.27) * Math.PI;
        const flen = fh * (0.35 + srng(seed+j*7)*0.25);
        ctx.strokeStyle = `hsl(${95+srng(seed+j)*20},${40+srng(seed+j*3)*20}%,${22+srng(seed+j*5)*10}%)`;
        ctx.beginPath();
        ctx.moveTo(topX, topY);
        ctx.quadraticCurveTo(
          topX + Math.cos(ang) * flen * 0.5 + srng(seed+j)*20-10,
          topY + Math.sin(ang) * flen * 0.5,
          topX + Math.cos(ang) * flen,
          topY + Math.sin(ang) * flen
        );
        ctx.stroke();
      }
    } else if (ftype === 2) {
      // Giant fern: thick stem + big drooping leaves
      const col = `hsl(${92+srng(seed+2)*20},${38+srng(seed+3)*18}%,${16+srng(seed+4)*10}%)`;
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(fx, GROUND_Y); ctx.lineTo(fx, GROUND_Y - fh); ctx.stroke();
      ctx.lineWidth = 2;
      for (let j = 0; j < 6; j++) {
        const ly = GROUND_Y - fh * (0.3 + j * 0.12);
        const ldir = j % 2 === 0 ? 1 : -1;
        const llen = fh * (0.3 + srng(seed+j*5)*0.2);
        ctx.strokeStyle = `hsl(${90+srng(seed+j*3)*25},${35+srng(seed+j)*18}%,${18+srng(seed+j*7)*10}%)`;
        ctx.beginPath();
        ctx.moveTo(fx, ly);
        ctx.quadraticCurveTo(fx + ldir*llen*0.5, ly - llen*0.2, fx + ldir*llen, ly + llen*0.15);
        ctx.stroke();
      }
    } else {
      // Classic fern: radiating curved fronds from base
      ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let j = 0; j < 6; j++) {
        const ang = (-0.55 + j * 0.22) * Math.PI;
        ctx.strokeStyle = `hsl(${88+srng(seed+j*3)*28},${38+srng(seed+j)*16}%,${18+srng(seed+j*5)*12}%)`;
        ctx.beginPath();
        ctx.moveTo(fx, GROUND_Y);
        ctx.quadraticCurveTo(
          fx + Math.cos(ang) * fh * 0.5,
          GROUND_Y - fh * 0.65,
          fx + Math.cos(ang) * fh,
          GROUND_Y - fh
        );
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Layer 3 (near): ground-level fern clumps
  const px3 = cx * 0.55;
  for (let i = 0; i < 18; i++) {
    const seed = i * 29 + 1100;
    const fx = ((i * 85 + srng(seed) * 40) - px3 + W * 2) % (W + 120) - 60;
    const fh = 18 + srng(seed+1) * 28;
    ctx.save();
    ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    for (let j = 0; j < 4; j++) {
      const ang = (-0.4 + j * 0.27) * Math.PI;
      ctx.strokeStyle = `hsl(${85+srng(seed+j)*30},${40+srng(seed+j*3)*20}%,${20+srng(seed+j*5)*12}%)`;
      ctx.beginPath();
      ctx.moveTo(fx, GROUND_Y - 4);
      ctx.quadraticCurveTo(
        fx + Math.cos(ang)*fh*0.5, GROUND_Y-4 - fh*0.7,
        fx + Math.cos(ang)*fh, GROUND_Y-4 - fh
      );
      ctx.stroke();
    }
    ctx.restore();
  }

  // Lava/magma glow at horizon (earthy prehistoric atmosphere)
  const haze = ctx.createLinearGradient(0, GROUND_Y - 30, 0, GROUND_Y);
  haze.addColorStop(0, 'rgba(80,40,10,0)');
  haze.addColorStop(1, 'rgba(120,60,15,0.18)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, GROUND_Y - 30, W, 30);
}

function drawBgHeaven(cx) {
  const px=cx*0.20;
  for (let i=0;i<10;i++) {
    const seed=i*29+200;
    const cloudX=((i*180+srng(seed)*80)-px+W*2)%(W+260)-130;
    const cloudY=30+srng(seed+1)*150, cw=60+srng(seed+2)*100;
    ctx.fillStyle='rgba(255,255,255,0.70)';
    ctx.beginPath();
    ctx.arc(cloudX,cloudY,cw*0.4,0,Math.PI*2);
    ctx.arc(cloudX+cw*0.3,cloudY-10,cw*0.35,0,Math.PI*2);
    ctx.arc(cloudX+cw*0.6,cloudY,cw*0.30,0,Math.PI*2);
    ctx.fill();
  }
  ctx.save(); ctx.globalAlpha=0.07;
  for (let i=0;i<8;i++) {
    ctx.fillStyle='#FFD700';
    ctx.beginPath(); ctx.moveTo(W/2,-20);
    ctx.lineTo(W/2+(i-4)*100-20,GROUND_Y); ctx.lineTo(W/2+(i-4)*100+20,GROUND_Y);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawBackground(ld, cx) {
  // Sky — use uploaded image if available, else procedural
  const skyImg = levelImgCache['sky'];
  if (skyImg && skyImg.complete && skyImg.naturalWidth > 0) {
    ctx.drawImage(skyImg, 0, 0, W, GROUND_Y);
  } else {
    const sky=ctx.createLinearGradient(0,0,0,GROUND_Y);
    sky.addColorStop(0,ld.skyColors[0]); sky.addColorStop(0.55,ld.skyColors[1]); sky.addColorStop(1,ld.skyColors[2]);
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,GROUND_Y);
    ctx.fillStyle=ld.starColor;
    for (let i=0;i<40;i++) {
      ctx.fillRect(srng(i*13)*W, srng(i*17+3)*GROUND_Y*0.55, srng(i*7+1)*1.5+0.5, srng(i*7+1)*1.5+0.5);
    }
    if (ld.id===1) drawBgJungle(cx);
    if (ld.id===2) drawBgCyber(cx);
    if (ld.id===3) drawBgDemon(cx);
    if (ld.id===4) drawBgJurassic(cx);
    if (ld.id===5) drawBgHeaven(cx);
  }
  // Parallax layer 1 (25% scroll speed)
  const p1Img = levelImgCache['parallax1'];
  if (p1Img && p1Img.complete && p1Img.naturalWidth > 0) {
    const p1off = (cx * 0.25) % p1Img.naturalWidth;
    ctx.drawImage(p1Img, -p1off, 0, p1Img.naturalWidth, GROUND_Y);
    if (p1off > 0) ctx.drawImage(p1Img, p1Img.naturalWidth - p1off, 0, p1Img.naturalWidth, GROUND_Y);
  }
  // Parallax layer 2 (50% scroll speed)
  const p2Img = levelImgCache['parallax2'];
  if (p2Img && p2Img.complete && p2Img.naturalWidth > 0) {
    const p2off = (cx * 0.50) % p2Img.naturalWidth;
    ctx.drawImage(p2Img, -p2off, 0, p2Img.naturalWidth, GROUND_Y);
    if (p2off > 0) ctx.drawImage(p2Img, p2Img.naturalWidth - p2off, 0, p2Img.naturalWidth, GROUND_Y);
  }
}

function drawGround(ld, cx) {
  const groundImg = levelImgCache['ground'];
  if (groundImg && groundImg.complete && groundImg.naturalWidth > 0) {
    const iw = groundImg.naturalWidth || W;
    const gh = H - GROUND_Y;
    const goff = cx % iw;
    ctx.drawImage(groundImg, -goff, GROUND_Y, iw, gh);
    if (goff > 0) ctx.drawImage(groundImg, iw - goff, GROUND_Y, iw, gh);
  } else {
    const sg=ctx.createLinearGradient(0,GROUND_Y,0,H);
    sg.addColorStop(0,ld.stoneTop); sg.addColorStop(0.15,ld.stoneMid); sg.addColorStop(1,ld.stoneBot);
    ctx.fillStyle=sg; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
    ctx.strokeStyle=ld.stoneGrid; ctx.lineWidth=1;
    const xOff=cx%32;
    for (let x=-xOff;x<=W;x+=32) { ctx.beginPath();ctx.moveTo(x,GROUND_Y);ctx.lineTo(x,H);ctx.stroke(); }
    for (let y=GROUND_Y+32;y<=H;y+=32) { ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
    ctx.fillStyle=ld.groundTop; ctx.fillRect(0,GROUND_Y-7,W,11);
    ctx.fillStyle=ld.groundMid; ctx.fillRect(0,GROUND_Y-11,W,6);
    ctx.fillStyle=ld.groundBot; ctx.fillRect(0,GROUND_Y+4,W,4);
    const bladeOff=cx%20;
    ctx.fillStyle=ld.groundBlade;
    for (let x=-bladeOff;x<W+20;x+=20) {
      ctx.beginPath(); ctx.moveTo(x,GROUND_Y-11); ctx.lineTo(x-4,GROUND_Y-18); ctx.lineTo(x+4,GROUND_Y-18); ctx.closePath(); ctx.fill();
    }
  }
}

function drawFinishLine() {
  const fx=finishX-camX;
  if (fx<-60||fx>W+60) return;
  for (let i=0;i<7;i++) {
    ctx.fillStyle=i%2===0?'#FFD700':'#222';
    ctx.fillRect(fx-4,GROUND_Y-100+i*14,8,14);
  }
  ctx.fillStyle='#FFD700'; ctx.fillRect(fx,GROUND_Y-100,36,16);
  ctx.fillStyle='#B8860B'; ctx.font='bold 9px monospace'; ctx.textAlign='left';
  ctx.fillText('FINISH',fx+2,GROUND_Y-90);
}

function drawSpike(sx, sy, ld) {
  const tipColors={
    1:['#ff8a80','#f44336','#b71c1c'],
    2:['#e040fb','#9c27b0','#4a148c'],
    3:['#ff6d00','#ff3d00','#bf360c'],
    4:['#ffca28','#ff8f00','#e65100'],
    5:['#ffffff','#e1f5fe','#81d4fa'],
  };
  const [c0,c1,c2]=tipColors[ld.id]||tipColors[1];
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.30)';
  ctx.beginPath(); ctx.moveTo(sx+4,sy+S_SIZE+4); ctx.lineTo(sx+S_SIZE/2+4,sy+4); ctx.lineTo(sx+S_SIZE+4,sy+S_SIZE+4); ctx.fill();
  const g=ctx.createLinearGradient(sx+S_SIZE/2,sy,sx+S_SIZE/2,sy+S_SIZE);
  g.addColorStop(0,c0); g.addColorStop(0.5,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(sx,sy+S_SIZE); ctx.lineTo(sx+S_SIZE/2,sy); ctx.lineTo(sx+S_SIZE,sy+S_SIZE); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=c0; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}

function drawCeilSpike(sx, sy, ld) {
  // Inverted spike: base at sy, tip pointing DOWN to sy+S_SIZE
  const tipColors = {
    1:['#ff8a80','#f44336','#b71c1c'],
    2:['#e040fb','#9c27b0','#4a148c'],
    3:['#ff6d00','#ff3d00','#bf360c'],
    4:['#ffca28','#ff8f00','#e65100'],
    5:['#ffffff','#e1f5fe','#81d4fa'],
  };
  const [c0,c1,c2] = tipColors[ld.id] || tipColors[1];
  ctx.save();
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.moveTo(sx+4,    sy-4);
  ctx.lineTo(sx+S_SIZE+4, sy-4);
  ctx.lineTo(sx+S_SIZE/2+4, sy+S_SIZE+4);
  ctx.fill();
  // Gradient — tip at bottom
  const g = ctx.createLinearGradient(sx+S_SIZE/2, sy+S_SIZE, sx+S_SIZE/2, sy);
  g.addColorStop(0, c0); g.addColorStop(0.5, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(sx,         sy);          // top left
  ctx.lineTo(sx+S_SIZE,  sy);          // top right
  ctx.lineTo(sx+S_SIZE/2, sy+S_SIZE);  // tip at bottom
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = c0; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function drawCoins() {
  const coinImg = levelSpriteCache['coin'];
  for (const c of coins) {
    if (c.collected) continue;
    const cx=c.wx-camX, cy=c.wy;
    if (cx<-C_SIZE-4||cx>W+4) continue;
    if (coinImg && coinImg.complete && coinImg.naturalWidth > 0) {
      ctx.drawImage(coinImg, cx, cy, C_SIZE, C_SIZE);
      continue;
    }
    const bob=Math.sin(gFrame*0.08+c.wx*0.01)*3;
    const ex = cx+C_SIZE/2, ey = cy+bob+C_SIZE/2;
    ctx.save();
    // Emerald — diamond/gem shape in green
    ctx.shadowColor='#00e676'; ctx.shadowBlur=10;
    // Gem body (hexagonal diamond)
    const gw = C_SIZE*0.48, gh = C_SIZE*0.54;
    const eg = ctx.createLinearGradient(ex-gw, ey-gh, ex+gw, ey+gh);
    eg.addColorStop(0, '#b9f6ca');
    eg.addColorStop(0.3, '#00e676');
    eg.addColorStop(0.7, '#00c853');
    eg.addColorStop(1, '#1b5e20');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.moveTo(ex,        ey - gh);      // top point
    ctx.lineTo(ex + gw,   ey - gh*0.2);  // upper right
    ctx.lineTo(ex + gw,   ey + gh*0.2);  // lower right
    ctx.lineTo(ex,        ey + gh);      // bottom point
    ctx.lineTo(ex - gw,   ey + gh*0.2);  // lower left
    ctx.lineTo(ex - gw,   ey - gh*0.2);  // upper left
    ctx.closePath();
    ctx.fill();
    // Shine facet
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(ex,        ey - gh);
    ctx.lineTo(ex + gw*0.6, ey - gh*0.15);
    ctx.lineTo(ex,        ey - gh*0.1);
    ctx.lineTo(ex - gw*0.3, ey - gh*0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawPlayer() {
  if (screen==='dead'&&deathDelay>=6) return;
  const px=player.wx-camX, py=player.wy;
  const rotRad = player.rot * Math.PI / 180;
  const skin = getSkin(saveData.equippedSkin);
  skin.draw(ctx, px, py, P_SIZE, rotRad);
}

// =============================================
//  DRAW — PLATFORMS (Charlie's design: teal bar with energy star-bursts)
// =============================================
function drawPlatforms(cx) {
  for (const pl of platforms) {
    const sx = pl._x - cx;
    if (sx < -pl.w - 10 || sx > W + 10) continue;
    const sy = pl._y;

    // Main bar
    const g = ctx.createLinearGradient(sx, sy, sx, sy + pl.h);
    g.addColorStop(0, '#00e5ff');
    g.addColorStop(0.5, '#00bcd4');
    g.addColorStop(1, '#006064');
    ctx.save();
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 10;
    ctx.fillStyle = g;
    rrect(sx, sy, pl.w, pl.h, 4); ctx.fill();
    ctx.strokeStyle = '#80deea'; ctx.lineWidth = 1.5;
    rrect(sx, sy, pl.w, pl.h, 4); ctx.stroke();
    ctx.shadowBlur = 0;

    // Energy star-burst spikes around the bar (Charlie's design)
    const burstCount = 6;
    const burstColors = ['#00e5ff', '#26c6da', '#69f0ae'];
    for (let i = 0; i < burstCount; i++) {
      const bx = sx + (i + 0.5) * (pl.w / burstCount);
      const byTop = sy - 6;
      const byBot = sy + pl.h + 6;
      const pulse = Math.sin(gFrame * 0.12 + i * 1.1) * 0.4 + 0.7;
      ctx.globalAlpha = pulse * 0.85;
      ctx.fillStyle = burstColors[i % burstColors.length];
      // Top burst
      ctx.beginPath();
      for (let s = 0; s < 6; s++) {
        const a = (s / 6) * Math.PI * 2;
        const r = s % 2 === 0 ? 6 : 2.5;
        const method = s === 0 ? 'moveTo' : 'lineTo';
        ctx[method](bx + Math.cos(a) * r, byTop + Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill();
      // Bottom burst
      ctx.beginPath();
      for (let s = 0; s < 6; s++) {
        const a = (s / 6) * Math.PI * 2;
        const r = s % 2 === 0 ? 6 : 2.5;
        const method = s === 0 ? 'moveTo' : 'lineTo';
        ctx[method](bx + Math.cos(a) * r, byBot + Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// =============================================
//  DRAW — PORTALS (Charlie's design: purple-pink oval with dots)
// =============================================
function drawPortal(wx, wy, pw, ph, cx, isEntrance) {
  const sx = wx - cx;
  if (sx < -pw - 10 || sx > W + 10) return;

  const centerX = sx + pw / 2;
  const centerY = wy + ph / 2;
  const rx = pw / 2, ry = ph / 2;
  const pulse = Math.sin(gFrame * 0.07) * 0.15 + 0.85;

  ctx.save();

  // Outer glow
  const glow = ctx.createRadialGradient(centerX, centerY, ry * 0.3, centerX, centerY, ry * 1.6);
  glow.addColorStop(0, 'rgba(206,147,216,0.25)');
  glow.addColorStop(1, 'rgba(206,147,216,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.ellipse(centerX, centerY, rx * 1.6, ry * 1.6, 0, 0, Math.PI*2); ctx.fill();

  // Outer ring (purple)
  ctx.strokeStyle = isEntrance ? '#ce93d8' : '#ff80ab';
  ctx.lineWidth = 4;
  ctx.shadowColor = isEntrance ? '#ce93d8' : '#ff80ab';
  ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.ellipse(centerX, centerY, rx * pulse, ry * pulse, 0, 0, Math.PI*2); ctx.stroke();

  // Inner ring (pink)
  ctx.strokeStyle = isEntrance ? '#ab47bc' : '#e91e63';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.ellipse(centerX, centerY, rx * 0.65 * pulse, ry * 0.65 * pulse, 0, 0, Math.PI*2); ctx.stroke();

  // Swirling dots around the oval (Charlie's design)
  const dotCount = 10;
  for (let i = 0; i < dotCount; i++) {
    const angle = (i / dotCount) * Math.PI * 2 + gFrame * 0.04;
    const dx = centerX + Math.cos(angle) * rx * 1.2;
    const dy = centerY + Math.sin(angle) * ry * 1.2;
    const dotPulse = Math.sin(gFrame * 0.1 + i * 0.8) * 0.5 + 0.5;
    ctx.globalAlpha = 0.6 + dotPulse * 0.4;
    ctx.fillStyle = i % 2 === 0 ? '#ce93d8' : '#ff4081';
    ctx.beginPath(); ctx.arc(dx, dy, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Label
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.font = 'bold 10px "Arial Black",Arial';
  ctx.textAlign = 'center';
  ctx.fillText(isEntrance ? 'IN' : 'OUT', centerX, wy + ph + 14);

  ctx.restore();
}

function drawPortals(cx) {
  for (const pair of portals) {
    drawPortal(pair.entrance.wx, pair.entrance.wy, pair.entrance.w, pair.entrance.h, cx, true);
    drawPortal(pair.exit.wx,     pair.exit.wy,     pair.exit.w,     pair.exit.h,     cx, false);
  }
}

// =============================================
//  DRAW — GRAVITY FLIPPERS (Charlie's design: teal bar with star-bursts)
// =============================================
function drawGravFlips(cx) {
  for (const gf of gravFlips) {
    const sx = gf.wx - cx;
    if (sx < -gf.w - 10 || sx > W + 10) continue;
    const sy = gf.wy;
    const isOnCeiling = gf.wy < 20;
    const pulse = Math.sin(gFrame * 0.10) * 0.3 + 0.8;

    ctx.save();
    // Bar
    const g = ctx.createLinearGradient(sx, sy, sx + gf.w, sy);
    g.addColorStop(0, '#26c6da');
    g.addColorStop(0.5, '#00e5ff');
    g.addColorStop(1, '#26c6da');
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 16 * pulse;
    ctx.fillStyle = g;
    rrect(sx, sy, gf.w, gf.h, 4); ctx.fill();
    ctx.strokeStyle = '#e0f7fa'; ctx.lineWidth = 1.5;
    rrect(sx, sy, gf.w, gf.h, 4); ctx.stroke();

    // Arrow indicating flip direction
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 0;
    ctx.fillText(isOnCeiling ? '▼' : '▲', sx + gf.w/2, sy + gf.h/2 + 4);

    // Energy star bursts (same aesthetic as platforms per Charlie's sketch)
    for (let i = 0; i < 5; i++) {
      const bx = sx + (i + 0.5) * (gf.w / 5);
      const burstY = isOnCeiling ? sy + gf.h + 8 : sy - 8;
      const bp = Math.sin(gFrame * 0.14 + i * 1.3) * 0.4 + 0.7;
      ctx.globalAlpha = bp * 0.9;
      ctx.fillStyle = '#69f0ae';
      ctx.beginPath();
      for (let s = 0; s < 6; s++) {
        const a = (s / 6) * Math.PI * 2 + gFrame * 0.03;
        const r = s % 2 === 0 ? 5 : 2;
        if (s === 0) ctx.moveTo(bx + Math.cos(a)*r, burstY + Math.sin(a)*r);
        else ctx.lineTo(bx + Math.cos(a)*r, burstY + Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// =============================================
//  DRAW — GHOST BALLS (electric orb — smaller, blue-white lightning)
// =============================================
function drawGhostBalls(cx) {
  for (const gb of ghostBalls) {
    const sx = gb.wx - cx;
    if (sx < -gb.r*4 || sx > W + gb.r*4) continue;

    const r = gb.r;
    const px2 = player.wx + P_SIZE/2, py = player.wy + P_SIZE/2;
    const dist = Math.hypot(px2 - gb.wx, py - gb.wy);
    const inRange = dist < r + P_SIZE/2 + 8;
    const pulse = Math.sin(gFrame * 0.15) * 0.18 + 1.0;

    ctx.save();

    // Outer electric glow
    const glow = ctx.createRadialGradient(sx, gb.wy, 0, sx, gb.wy, r * 2.8);
    glow.addColorStop(0, `rgba(255,220,50,${inRange ? 0.45 : 0.20})`);
    glow.addColorStop(0.5, `rgba(255,160,0,${inRange ? 0.22 : 0.09})`);
    glow.addColorStop(1, 'rgba(200,100,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sx, gb.wy, r * 2.8, 0, Math.PI*2); ctx.fill();

    // Lightning bolt arms — jagged lines from center outward
    const boltCount = 6;
    ctx.lineWidth = inRange ? 2 : 1.5;
    ctx.lineCap = 'round';
    for (let i = 0; i < boltCount; i++) {
      const baseAngle = (i / boltCount) * Math.PI * 2 + gFrame * 0.04;
      const boltLen = r * (1.4 + Math.sin(gFrame * 0.2 + i * 1.7) * 0.4) * pulse;
      ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,240,120,0.95)' : 'rgba(255,255,200,0.80)';
      ctx.shadowColor = '#FFD700';
      ctx.shadowBlur = inRange ? 14 : 7;
      ctx.beginPath();
      // Jagged bolt with 3 segments
      let bx = sx, by = gb.wy;
      for (let seg = 0; seg < 3; seg++) {
        const segFrac = (seg + 1) / 3;
        const jitter = (Math.sin(gFrame * 0.3 + i * 2.1 + seg * 3.7) * r * 0.35);
        const perpA = baseAngle + Math.PI/2;
        const nx = sx + Math.cos(baseAngle) * boltLen * segFrac + Math.cos(perpA) * jitter;
        const ny = gb.wy + Math.sin(baseAngle) * boltLen * segFrac + Math.sin(perpA) * jitter;
        if (seg === 0) ctx.moveTo(bx, by);
        ctx.lineTo(nx, ny);
        bx = nx; by = ny;
      }
      ctx.stroke();
    }

    // Core orb
    const cg = ctx.createRadialGradient(sx - r*0.25, gb.wy - r*0.25, r*0.05, sx, gb.wy, r * pulse);
    cg.addColorStop(0, '#ffffff');
    cg.addColorStop(0.3, '#fff9c4');
    cg.addColorStop(0.7, '#FFD700');
    cg.addColorStop(1, '#e65100');
    ctx.fillStyle = cg;
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = inRange ? 22 : 11;
    ctx.beginPath(); ctx.arc(sx, gb.wy, r * pulse, 0, Math.PI*2); ctx.fill();

    // Inner bright core flash
    ctx.fillStyle = `rgba(255,255,255,${0.55 + Math.sin(gFrame * 0.22) * 0.25})`;
    ctx.beginPath(); ctx.arc(sx - r*0.2, gb.wy - r*0.2, r * 0.3, 0, Math.PI*2); ctx.fill();

    // "Press SPACE" hint when in range
    if (inRange) {
      ctx.shadowBlur = 0;
      ctx.globalAlpha = Math.sin(gFrame * 0.18) * 0.4 + 0.7;
      ctx.fillStyle = '#fff9c4';
      ctx.font = 'bold 11px "Arial Black",Arial';
      ctx.textAlign = 'center';
      ctx.fillText('SPACE!', sx, gb.wy - r - 12);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }
}

// =============================================
//  DRAW — GRAVITY FLIP CEILING EFFECT (Charlie's design: pulsing energy lines)
// =============================================
function drawGravityEffect() {
  if (!gravityFlipped) return;
  const lineCount = 18;
  ctx.save();
  for (let i = 0; i < lineCount; i++) {
    const t = gFrame * 0.05 + i * 0.7;
    const alpha = (Math.sin(t) * 0.35 + 0.55) * 0.85;
    const len = 30 + Math.sin(t * 1.3 + i) * 20;
    const x = ((i * (W / lineCount)) + gFrame * 2 + i * 15) % (W + 40) - 20;
    const baseY = 6;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = i % 3 === 0 ? '#69f0ae' : '#00e5ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 8;
    // Spiky line: zigzag downward from ceiling
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    for (let j = 0; j < 4; j++) {
      const jx = x + (j % 2 === 0 ? 3 : -3);
      ctx.lineTo(jx, baseY + j * (len / 4));
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  // Subtle teal tint at top of screen
  const tint = ctx.createLinearGradient(0, 0, 0, 40);
  tint.addColorStop(0, 'rgba(0,229,255,0.18)');
  tint.addColorStop(1, 'rgba(0,229,255,0)');
  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, 40);
  ctx.restore();
}


// =============================================
//  DRAW — SOLID BLOCKS (stone/gray brick — land on top, die from sides)
// =============================================
function drawSolidBlocks(cx) {
  for (const blk of solidBlocks) {
    const sx = blk.wx - cx;
    if (sx < -BLK_SIZE - 4 || sx > W + 4) continue;
    const sy = blk.wy;
    const ld = levelDef;

    ctx.save();
    // Block face — level-tinted stone
    const bg = ctx.createLinearGradient(sx, sy, sx, sy + BLK_SIZE);
    bg.addColorStop(0, ld.stoneTop);
    bg.addColorStop(0.5, ld.stoneMid);
    bg.addColorStop(1, ld.stoneBot);
    ctx.fillStyle = bg;
    ctx.fillRect(sx, sy, BLK_SIZE, BLK_SIZE);

    // Brick grid lines
    ctx.strokeStyle = ld.stoneGrid;
    ctx.lineWidth = 1;
    ctx.strokeRect(sx + 0.5, sy + 0.5, BLK_SIZE - 1, BLK_SIZE - 1);
    // Inner cross detail
    ctx.beginPath();
    ctx.moveTo(sx + BLK_SIZE/2, sy);
    ctx.lineTo(sx + BLK_SIZE/2, sy + BLK_SIZE);
    ctx.moveTo(sx, sy + BLK_SIZE/2);
    ctx.lineTo(sx + BLK_SIZE, sy + BLK_SIZE/2);
    ctx.stroke();

    // Top highlight (shows it's landable)
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(sx, sy, BLK_SIZE, 3);

    ctx.restore();
  }
}

function drawEmeraldIcon(x, y, size) {
  const gw = size * 0.48, gh = size * 0.56;
  ctx.save();
  ctx.shadowColor = '#00e676'; ctx.shadowBlur = 6;
  const eg = ctx.createLinearGradient(x-gw, y-gh, x+gw, y+gh);
  eg.addColorStop(0, '#b9f6ca'); eg.addColorStop(0.35, '#00e676');
  eg.addColorStop(0.7, '#00c853'); eg.addColorStop(1, '#1b5e20');
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.moveTo(x,      y - gh);
  ctx.lineTo(x + gw, y - gh*0.2);
  ctx.lineTo(x + gw, y + gh*0.2);
  ctx.lineTo(x,      y + gh);
  ctx.lineTo(x - gw, y + gh*0.2);
  ctx.lineTo(x - gw, y - gh*0.2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.moveTo(x,        y - gh);
  ctx.lineTo(x + gw*0.6, y - gh*0.15);
  ctx.lineTo(x,        y - gh*0.1);
  ctx.lineTo(x - gw*0.3, y - gh*0.5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

  const pct = lastDistPct;
  ctx.fillStyle='#fff'; ctx.font='bold 20px "Arial Black",Arial';

  // Progress bar
  const bw=300,bh=18,bx=W/2-bw/2,by=H/2-8;

// ── V7: Night Ocean — bioluminescent waves, moonlit water, shooting stars ──
function drawTitleV7() {
  // Night ocean sky
  const sky=ctx.createLinearGradient(0,0,0,H*0.55);
  sky.addColorStop(0,'#000510'); sky.addColorStop(0.5,'#001030'); sky.addColorStop(1,'#001848');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.55);
  // Stars
  for(let i=0;i<90;i++){
    const t=Math.sin(gFrame*0.03+i*1.5)*0.25+0.75;
    ctx.globalAlpha=srng(i*13+1)*0.65*t;
    ctx.fillStyle=srng(i*7+3)>0.8?'#ffe8c0':'#c8e0ff';
    ctx.fillRect(srng(i*17+3)*W,srng(i*11+7)*H*0.48,srng(i*7+1)*1.6+0.3,srng(i*7+1)*1.6+0.3);
  }
  ctx.globalAlpha=1;
  // Moon — upper left
  const mX=90,mY=72,mR=38;
  const mg=ctx.createRadialGradient(mX,mY,mR*0.4,mX,mY,mR*3);
  mg.addColorStop(0,'rgba(200,230,255,0.45)'); mg.addColorStop(1,'rgba(150,200,255,0)');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mX,mY,mR*3,0,Math.PI*2); ctx.fill();
  const md=ctx.createRadialGradient(mX-10,mY-10,4,mX,mY,mR);
  md.addColorStop(0,'#f8fbff'); md.addColorStop(0.5,'#d8eaff'); md.addColorStop(1,'#a8c8f0');
  ctx.fillStyle=md; ctx.beginPath(); ctx.arc(mX,mY,mR,0,Math.PI*2); ctx.fill();
  // Moon path on water
  const moonPath=ctx.createLinearGradient(mX-30,H*0.5,mX+30,H);
  moonPath.addColorStop(0,'rgba(200,230,255,0.30)'); moonPath.addColorStop(1,'rgba(200,230,255,0.05)');
  ctx.fillStyle=moonPath;
  ctx.beginPath(); ctx.moveTo(mX-28,H*0.52); ctx.lineTo(mX+28,H*0.52); ctx.lineTo(mX+50,H); ctx.lineTo(mX-50,H); ctx.closePath(); ctx.fill();
  // Ocean
  const ocean=ctx.createLinearGradient(0,H*0.50,0,H);
  ocean.addColorStop(0,'#001848'); ocean.addColorStop(0.3,'#001030'); ocean.addColorStop(1,'#000818');
  ctx.fillStyle=ocean; ctx.fillRect(0,H*0.50,W,H*0.50);
  // Horizon cliffs
  ctx.fillStyle='#000c1e'; ctx.beginPath(); ctx.moveTo(0,H*0.52);
  [[0,H*0.52],[80,H*0.44],[150,H*0.50],[260,H*0.42],[350,H*0.48],[460,H*0.40],[560,H*0.46],[660,H*0.41],[750,H*0.47],[800,H*0.50],[800,H*0.52]].forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.closePath(); ctx.fill();
  // Bioluminescent waves
  for(let w=0;w<5;w++){
    const wy=H*0.55+w*28, wPhase=gFrame*0.025+w*0.8;
    ctx.beginPath(); ctx.moveTo(0,wy);
    for(let x=0;x<=W;x+=8){ctx.lineTo(x,wy+Math.sin(x*0.018+wPhase)*6+Math.sin(x*0.035+wPhase*1.3)*3);}
    const wg=ctx.createLinearGradient(0,wy-4,0,wy+8);
    wg.addColorStop(0,`rgba(0,200,255,${0.15-w*0.02})`); wg.addColorStop(0.5,`rgba(0,255,220,${0.30-w*0.04})`); wg.addColorStop(1,'rgba(0,100,200,0)');
    ctx.strokeStyle=wg; ctx.lineWidth=2.5-w*0.3; ctx.stroke();
  }
  // Glowing particles rising from waves
  for(let i=0;i<20;i++){
    const px2=((srng(i*23+1)*W+gFrame*srng(i*11+3)*0.5)%(W+20))-10;
    const py2=H*0.55+srng(i*7+1)*80-((gFrame*0.8+i*30)%120);
    if(py2<H*0.50||py2>H) continue;
    const pulse=Math.sin(gFrame*0.08+i*1.9)*0.4+0.6;
    const pg=ctx.createRadialGradient(px2,py2,0,px2,py2,6);
    pg.addColorStop(0,`rgba(0,255,220,${0.8*pulse})`); pg.addColorStop(1,'rgba(0,200,255,0)');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(px2,py2,6,0,Math.PI*2); ctx.fill();
  }
  // Shooting stars — 4 independent, staggered timers
  const shootingStars = [
    { period:320, offset:0,   tailLen:110, angle:0.42, startX:0.15, startY:0.08 },
    { period:480, offset:140, tailLen:90,  angle:0.38, startX:0.55, startY:0.05 },
    { period:400, offset:260, tailLen:130, angle:0.45, startX:0.05, startY:0.12 },
    { period:560, offset:80,  tailLen:80,  angle:0.35, startX:0.70, startY:0.04 },
  ];
  for (const s of shootingStars) {
    const t = (gFrame + s.offset) % s.period;
    const visibleFor = s.period * 0.25;
    if (t > visibleFor) continue;
    const progress = t / visibleFor;
    const alpha = progress < 0.15 ? progress / 0.15 : 1 - ((progress - 0.15) / 0.85);
    if (alpha <= 0) continue;
    const headX = s.startX * W + Math.cos(s.angle) * s.tailLen * 2.5 * progress;
    const headY = s.startY * H + Math.sin(s.angle) * s.tailLen * 2.5 * progress;
    const tailX = headX - Math.cos(s.angle) * s.tailLen * Math.min(progress * 3, 1);
    const tailY = headY - Math.sin(s.angle) * s.tailLen * Math.min(progress * 3, 1);
    ctx.save();
    const glowGrad=ctx.createLinearGradient(tailX,tailY,headX,headY);
    glowGrad.addColorStop(0,'rgba(180,240,255,0)'); glowGrad.addColorStop(0.6,`rgba(200,245,255,${alpha*0.25})`); glowGrad.addColorStop(1,`rgba(255,255,255,${alpha*0.5})`);
    ctx.strokeStyle=glowGrad; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(tailX,tailY); ctx.lineTo(headX,headY); ctx.stroke();
    const coreGrad=ctx.createLinearGradient(tailX,tailY,headX,headY);
    coreGrad.addColorStop(0,'rgba(180,240,255,0)'); coreGrad.addColorStop(0.7,`rgba(220,248,255,${alpha*0.7})`); coreGrad.addColorStop(1,`rgba(255,255,255,${alpha})`);
    ctx.strokeStyle=coreGrad; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(tailX,tailY); ctx.lineTo(headX,headY); ctx.stroke();
    const headGlow=ctx.createRadialGradient(headX,headY,0,headX,headY,8);
    headGlow.addColorStop(0,`rgba(255,255,255,${alpha})`); headGlow.addColorStop(0.4,`rgba(180,240,255,${alpha*0.6})`); headGlow.addColorStop(1,'rgba(0,200,255,0)');
    ctx.fillStyle=headGlow; ctx.beginPath(); ctx.arc(headX,headY,8,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  drawNightTitleUI('#e0f8ff','#40e0ff','#0060a0','#004488','#00ccff','#0055aa','#00aaff','#00ccff');
}

function drawDefaultSkin(ctx, cx, cy, size, rot) {
  // The standard cyan cube (matches existing drawPlayer)
  ctx.save();
  ctx.translate(cx + size/2, cy + size/2);
  ctx.rotate(rot);
  const half = size/2;
  const g = ctx.createLinearGradient(-half,-half,half,half);
  g.addColorStop(0,'#80deea'); g.addColorStop(0.4,'#00e5ff'); g.addColorStop(1,'#006064');
  ctx.shadowColor='#00e5ff'; ctx.shadowBlur=12;
  ctx.fillStyle=g;
  ctx.fillRect(-half,-half,size,size);
  // Inner diamond
  ctx.fillStyle='rgba(0,229,255,0.35)';
  ctx.beginPath();
  ctx.moveTo(0,-half*0.55); ctx.lineTo(half*0.55,0);
  ctx.lineTo(0,half*0.55); ctx.lineTo(-half*0.55,0);
  ctx.closePath(); ctx.fill();
  // Shine
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillRect(-half,-half,size*0.38,size*0.18);
  ctx.restore();
}

function drawImageSkin(ctx, cx, cy, size, rot, img) {
  if (!img || !img.complete || !img.naturalWidth) {
    drawDefaultSkin(ctx, cx, cy, size, rot);
    return;
  }
  ctx.save();
  ctx.translate(cx + size/2, cy + size/2);
  ctx.rotate(rot);
  const half = size/2;
  ctx.drawImage(img, -half, -half, size, size);
  ctx.restore();
}

function drawPlaceholderSkin(ctx, cx, cy, size, rot, col1, col2) {
  ctx.save();
  ctx.translate(cx + size/2, cy + size/2);
  ctx.rotate(rot);
  const half = size/2;
  const g = ctx.createLinearGradient(-half,-half,half,half);
  g.addColorStop(0,col1); g.addColorStop(1,col2);
  ctx.shadowColor=col1; ctx.shadowBlur=10;
  ctx.fillStyle=g;
  ctx.fillRect(-half,-half,size,size);
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.fillRect(-half,-half,size*0.4,size*0.18);
  ctx.restore();
}

  const ocean=ctx.createLinearGradient(0,H*0.50,0,H);
  ocean.addColorStop(0,'#001848'); ocean.addColorStop(1,'#000818');
  ctx.fillStyle=ocean; ctx.fillRect(0,H*0.50,W,H*0.50);
  ctx.fillStyle='rgba(0,8,20,0.62)'; ctx.fillRect(0,0,W,H);

  ctx.save(); ctx.textAlign='center';

  // Title
  ctx.fillStyle='#00ccff'; ctx.shadowColor='#00ccff'; ctx.shadowBlur=18;
  ctx.font='bold 32px "Arial Black",Arial'; ctx.fillText('🛒  SKIN STORE',W/2,46); ctx.shadowBlur=0;

  // Emerald balance
  const bal = saveData.coins;
  drawEmeraldIcon(W/2-58, 58, 11);
  ctx.fillStyle='#00e676'; ctx.font='bold 14px "Arial Black",Arial';
  ctx.fillText(`${bal} emeralds`, W/2+10, 62);

  // Skin cards
  for (let i = 0; i < SKINS.length; i++) {
    const skin = SKINS[i];
    const cx = storeCardX(i);
    const cy = CARDS_Y;
    if (cx + CARD_W < 0 || cx > W) continue;

    const owned  = saveData.ownedSkins.includes(skin.id);
    const equipped = saveData.equippedSkin === skin.id;
    const hovered = storeHovered === skin.id;
    const canAfford = bal >= skin.price;
    const unavailable = !skin.available;

    // Card background
    ctx.save();
    if (equipped) {
      ctx.fillStyle='rgba(0,100,60,0.80)';
    } else if (owned) {
      ctx.fillStyle='rgba(0,40,80,0.80)';
    } else {
      ctx.fillStyle='rgba(0,8,25,0.80)';
    }
    rrect(cx, cy, CARD_W, CARD_H, 10); ctx.fill();

    // Border
    if (equipped) {
      ctx.strokeStyle='#00e676'; ctx.lineWidth=2.5;
      ctx.shadowColor='#00e676'; ctx.shadowBlur=10;
    } else if (hovered && !unavailable) {
      ctx.strokeStyle='#FFD700'; ctx.lineWidth=2;
      ctx.shadowColor='#FFD700'; ctx.shadowBlur=8;
    } else {
      ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=1;
    }
    rrect(cx, cy, CARD_W, CARD_H, 10); ctx.stroke();
    ctx.shadowBlur=0;

    // Skin preview
    const previewX = cx + (CARD_W - PREVIEW_SIZE)/2;
    const previewY = cy + 12;
    if (unavailable) {
      // Locked — show question mark
      ctx.fillStyle='rgba(255,255,255,0.06)';
      ctx.fillRect(previewX, previewY, PREVIEW_SIZE, PREVIEW_SIZE);
      ctx.fillStyle='rgba(255,255,255,0.20)';
      ctx.font='bold 28px "Arial Black",Arial'; ctx.textAlign='center';
      ctx.fillText('?', previewX + PREVIEW_SIZE/2, previewY + PREVIEW_SIZE/2 + 10);
    } else {
      skin.draw(ctx, previewX, previewY, PREVIEW_SIZE, 0);
    }

    // Name
    ctx.fillStyle = unavailable ? '#444' : '#fff';
    ctx.font='bold 11px "Arial Black",Arial'; ctx.textAlign='center';
    ctx.fillText(skin.name, cx+CARD_W/2, cy+PREVIEW_SIZE+26);

    // Desc
    ctx.fillStyle = unavailable ? '#333' : 'rgba(255,255,255,0.50)';
    ctx.font='9px Arial'; ctx.textAlign='center';
    ctx.fillText(skin.desc, cx+CARD_W/2, cy+PREVIEW_SIZE+40);

    // Action area
    const btnY = cy + CARD_H - 36;
    const btnW = CARD_W - 20, btnH = 26, btnX = cx + 10;

    if (unavailable) {
      // Coming soon
      ctx.fillStyle='rgba(255,255,255,0.05)';
      rrect(btnX, btnY, btnW, btnH, 5); ctx.fill();
      ctx.fillStyle='rgba(0,200,255,0.35)'; ctx.font='bold 8px "Arial Black",Arial';
      ctx.fillText('COMING SOON', cx+CARD_W/2, btnY+btnH/2+3);
    } else if (equipped) {
      ctx.fillStyle='rgba(0,200,80,0.25)';
      rrect(btnX, btnY, btnW, btnH, 5); ctx.fill();
      ctx.strokeStyle='#00e676'; ctx.lineWidth=1;
      rrect(btnX, btnY, btnW, btnH, 5); ctx.stroke();
      ctx.fillStyle='#00e676'; ctx.font='bold 9px "Arial Black",Arial';
      ctx.fillText('✓ EQUIPPED', cx+CARD_W/2, btnY+btnH/2+3);
    } else if (owned) {
      ctx.fillStyle='rgba(0,80,160,0.60)';
      rrect(btnX, btnY, btnW, btnH, 5); ctx.fill();
      ctx.strokeStyle='rgba(0,200,255,0.50)'; ctx.lineWidth=1;
      rrect(btnX, btnY, btnW, btnH, 5); ctx.stroke();
      ctx.fillStyle='#80ccff'; ctx.font='bold 9px "Arial Black",Arial';
      ctx.fillText('EQUIP', cx+CARD_W/2, btnY+btnH/2+3);
    } else if (skin.price === 0) {
      // Free (default, already owned by definition — handled above)
    } else {
      // Buy button
      ctx.fillStyle = canAfford ? 'rgba(0,150,80,0.60)' : 'rgba(60,30,30,0.60)';
      rrect(btnX, btnY, btnW, btnH, 5); ctx.fill();
      ctx.strokeStyle = canAfford ? 'rgba(0,230,120,0.60)' : 'rgba(150,50,50,0.40)';
      ctx.lineWidth=1; rrect(btnX, btnY, btnW, btnH, 5); ctx.stroke();
      drawEmeraldIcon(btnX+8, btnY+btnH/2, 7);
      ctx.fillStyle = canAfford ? '#69f0ae' : '#884444';
      ctx.font='bold 9px "Arial Black",Arial'; ctx.textAlign='left';
      ctx.fillText(`${skin.price}`, btnX+20, btnY+btnH/2+3);
      ctx.textAlign='center';
      ctx.fillStyle = canAfford ? 'rgba(255,255,255,0.80)' : 'rgba(255,255,255,0.30)';
      ctx.fillText('BUY', cx+CARD_W/2+12, btnY+btnH/2+3);
    }
    ctx.restore();
  }

  // Scroll hint arrows if needed
  const totalW = storeTotalWidth();
  if (totalW > W) {
    if (storeScrollX > 0) {
      ctx.fillStyle='rgba(0,200,255,0.50)'; ctx.font='bold 20px Arial'; ctx.textAlign='center';
      ctx.fillText('◀', 16, CARDS_Y + CARD_H/2);
    }
    if (storeScrollX < totalW - W + 32) {
      ctx.fillStyle='rgba(0,200,255,0.50)'; ctx.font='bold 20px Arial'; ctx.textAlign='center';
      ctx.fillText('▶', W-16, CARDS_Y + CARD_H/2);
    }
  }

  // Back button
  drawBtn(20,14,90,30,'← BACK','rgba(0,20,50,0.80)','#00ccff',13);
  ctx.restore();
}

// =============================================
//  UTILITIES
// =============================================
function rrect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function overlay(a=0.75) {
  ctx.fillStyle=`rgba(5,10,5,${a})`; ctx.fillRect(0,0,W,H);
}

function drawBtn(x,y,w,h,label,bg,fg,fs=18) {
  ctx.save();
  ctx.fillStyle=bg; rrect(x,y,w,h,8); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.5; rrect(x,y,w,h,8); ctx.stroke();
  ctx.fillStyle=fg; ctx.font=`bold ${fs}px "Arial Black",Arial`; ctx.textAlign='center';
  ctx.fillText(label,x+w/2,y+h/2+fs*0.36);
  ctx.restore();
}

// =============================================
//  MAIN DRAW
// =============================================
function draw() {
  ctx.clearRect(0,0,W,H);

  if (screen==='title') {
    drawTitle();
  } else if (screen==='levelselect') {
    drawLevelSelect();
  } else if (screen==='store') {
    drawStore();
  } else {
    // Game world
    drawBackground(levelDef,camX);
    drawGround(levelDef,camX);
    drawFinishLine();
    drawPlatforms(camX);
    drawPortals(camX);
    drawGravFlips(camX);
    drawGhostBalls(camX);
    drawSolidBlocks(camX);
    for (const sp of spikes) {
      const sx=sp.wx-camX;
      if (sx<-S_SIZE-4||sx>W+4) continue;
      const sImg = levelSpriteCache['spike'];
      if (sImg && sImg.complete && sImg.naturalWidth > 0) {
        ctx.drawImage(sImg, sx, sp.wy, S_SIZE, S_SIZE);
      } else {
        drawSpike(sx,sp.wy,levelDef);
      }
    }
    for (const sp of ceilSpikes) {
      const sx=sp.wx-camX;
      if (sx<-S_SIZE-4||sx>W+4) continue;
      const csImg = levelSpriteCache['ceilspike'];
      if (csImg && csImg.complete && csImg.naturalWidth > 0) {
        ctx.drawImage(csImg, sx, sp.wy, S_SIZE, S_SIZE);
      } else {
        drawCeilSpike(sx, sp.wy, levelDef);
      }
    }
    drawCoins();
    drawGravityEffect();
    for (const p of particles) p.draw(camX);
    drawPlayer();
    if (screen==='playing'||screen==='ready') drawHUD();
    if (isTestPlay && (screen==='playing'||screen==='ready'||screen==='dead'||screen==='win')) drawBuilderBtn();
    if (screen==='ready')                     drawReady();
    if (screen==='dead'&&deathDelay>32)       drawDead();
    if (screen==='win')                        drawWin();
    drawPauseMenu();
  }

  // Fade overlay
  if (fadeAlpha>0) {
    ctx.fillStyle=`rgba(0,0,0,${fadeAlpha})`; ctx.fillRect(0,0,W,H);
  }
}

// =============================================

function loop() { update(); draw(); requestAnimationFrame(loop); }


// =============================================
//  STARTUP — check for test play from builder
// =============================================
(function() {
  try {
    const testJSON = localStorage.getItem('ceubeDashTestLevel');
    if (testJSON) {
      const json = JSON.parse(testJSON);
      localStorage.removeItem('ceubeDashTestLevel');
      testLevelJSON = json;  // keep in memory for retry
      if (loadLevelFromJSON(json)) {
        paused = false; frame = 0; jumpHeld = false;
        camX = 0; particles = []; winParticles = [];
        deathDelay = 0; winFrame = 0; gravityFlipped = false;
        for (const pl of platforms) {
          pl._x=pl.wx; pl._y=pl.wy; pl._prevX=pl.wx; pl._prevY=pl.wy; pl.t=0; pl.riderDX=0;
        }
        player = { wx:100, wy:GROUND_Y-P_SIZE, vy:0, onGround:true,
                   jumpsLeft:maxJumps, rot:0, alive:true, trailT:0, onPlatform:null };
        screen = 'ready';
        isTestPlay = true;
        loop();
        return;
      }
    }
  } catch(e) { console.warn('Test play load failed:', e); }
  // Normal startup — go to title screen
  loadLevel(5);  // pre-load level 5 data so it's ready
  screen = 'title';
  loop();
})();
